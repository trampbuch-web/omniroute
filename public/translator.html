<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RU ⇄ 中文</title>
    <style>
      :root {
        --bg: #f5f5f7;
        --card: #fff;
        --text: #111;
        --muted: #666;
        --ru: #2563eb;
        --zh: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f0f10;
          --card: #1c1c1e;
          --text: #f2f2f2;
          --muted: #999;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .half {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 16px;
        gap: 12px;
        min-height: 0;
      }
      .half.zh {
        transform: rotate(180deg);
      } /* face-to-face: Chinese speaker sits opposite */
      .out {
        flex: 1;
        overflow-y: auto;
        background: var(--card);
        border-radius: 16px;
        padding: 16px;
        font-size: 1.4rem;
        line-height: 1.4;
      }
      .out .note {
        display: block;
        margin-top: 8px;
        font-size: 0.95rem;
        color: var(--muted);
      }
      .out .mine {
        display: block;
        font-size: 0.95rem;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row input {
        flex: 1;
        min-width: 0;
        font-size: 1rem;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid #8884;
        background: var(--card);
        color: var(--text);
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 1rem;
        color: #fff;
        cursor: pointer;
      }
      .ru button {
        background: var(--ru);
      }
      .zh button {
        background: var(--zh);
      }
      .mic {
        width: 100%;
        padding: 18px;
        font-size: 1.2rem;
      }
      .msg + .msg {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #8883;
      }
      .live {
        display: block;
        color: var(--muted);
        font-style: italic;
      }
      .mic.on {
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.6;
        }
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 16px;
        font-size: 0.85rem;
        color: var(--muted);
        border-block: 1px solid #8883;
      }
      .bar button {
        background: transparent;
        color: var(--muted);
        padding: 4px 8px;
      }
      .bar button[aria-pressed="true"] {
        color: var(--zh);
        font-weight: 600;
      }
      dialog {
        border: 0;
        border-radius: 16px;
        background: var(--card);
        color: var(--text);
        width: min(420px, calc(100% - 32px));
      }
      dialog label {
        display: block;
        margin: 10px 0 4px;
        font-size: 0.9rem;
      }
      dialog input {
        width: 100%;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #8884;
        background: var(--bg);
        color: var(--text);
      }
      dialog button {
        background: var(--ru);
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <section class="half zh" lang="zh">
      <div class="out" id="out-zh" aria-live="polite">按下按钮，说中文。</div>
      <div class="row">
        <input id="txt-zh" placeholder="或者在这里输入…" /><button data-send="zh">发送</button>
      </div>
      <button class="mic" data-mic="zh">🎤 说话</button>
    </section>

    <div class="bar">
      <span id="status">Готово</span>
      <button id="auto" aria-pressed="false">🎧 Авто: говорят оба</button>
      <button id="open-settings" aria-label="Настройки">⚙︎ Настройки</button>
    </div>

    <section class="half ru">
      <div class="out" id="out-ru" aria-live="polite">Нажмите кнопку и говорите по-русски.</div>
      <div class="row">
        <input id="txt-ru" placeholder="Или напишите здесь…" /><button data-send="ru">
          Отправить
        </button>
      </div>
      <button class="mic" data-mic="ru">🎤 Говорить</button>
    </section>

    <dialog id="settings">
      <form method="dialog">
        <strong>Настройки OmniRoute</strong>
        <label for="s-key">API-ключ (Dashboard → API Keys)</label>
        <input id="s-key" type="password" autocomplete="off" />
        <label for="s-model">Модель (например <code>openai/gpt-4o</code> или имя комбо)</label>
        <input id="s-model" />
        <label for="s-stt">Модель распознавания для режима «Авто»</label>
        <input id="s-stt" placeholder="groq/whisper-large-v3-turbo" />
        <label><input id="s-voice" type="checkbox" style="width: auto" /> Озвучивать перевод</label>
        <button>Сохранить</button>
      </form>
    </dialog>

    <script>
      const LANG = {
        ru: {
          name: "Russian",
          speech: "ru-RU",
          other: "zh",
          listening: "Слушаю… (нажмите ещё раз — стоп)",
        },
        zh: {
          name: "Simplified Chinese",
          speech: "zh-CN",
          other: "ru",
          listening: "正在听…（再按一次停止）",
        },
      };
      const $ = (id) => document.getElementById(id);
      const store = {
        get: (k, d) => {
          try {
            return localStorage.getItem(k) ?? d;
          } catch {
            return d;
          }
        },
        set: (k, v) => {
          try {
            localStorage.setItem(k, v);
          } catch {}
        },
      };
      const history = []; // last turns give the model context for hints and running jokes

      function systemPrompt(from, to) {
        return `You are a live interpreter between a Russian speaker and a Chinese speaker talking face to face.
Translate the message from ${LANG[from].name} into ${LANG[to].name}.
Convey meaning, not words: keep the speaker's tone, politeness level, humor, irony, sarcasm, idioms and hints.
Replace idioms with natural equivalents in the target culture. Use the earlier conversation to resolve hints and references.
The input comes from speech recognition and may have errors or no punctuation; infer what was meant.
Reply ONLY with JSON: {"translation": "...", "note": "..."}.
"note" is written in ${LANG[to].name}: one short sentence explaining hidden meaning, irony, a hint, or emotional tone ONLY if a literal reading would miss it; otherwise "".`;
      }

      function parseReply(text) {
        const s = String(text).replace(/^\s*```(?:json)?\s*|\s*```\s*$/g, "");
        try {
          const j = JSON.parse(s.slice(s.indexOf("{"), s.lastIndexOf("}") + 1));
          return { translation: String(j.translation ?? ""), note: String(j.note ?? "") };
        } catch {
          return { translation: s.trim(), note: "" }; // model ignored JSON format: show raw text
        }
      }

      async function translate(from, text) {
        const to = LANG[from].other;
        const key = store.get("tr.key", "");
        const model = store.get("tr.model", "");
        if (!model) {
          $("settings").showModal();
          throw new Error("Укажите модель в настройках");
        }
        const res = await fetch("/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            ...(key && { Authorization: `Bearer ${key}` }),
          },
          body: JSON.stringify({
            model,
            stream: false,
            temperature: 0.3,
            messages: [
              { role: "system", content: systemPrompt(from, to) },
              ...history
                .slice(-10)
                .map((h) => ({ role: "user", content: `[${h.from}] ${h.text}` })),
              { role: "user", content: text },
            ],
          }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${(await res.text()).slice(0, 200)}`);
        const data = await res.json();
        history.push({ from, text });
        return { to, ...parseReply(data.choices?.[0]?.message?.content ?? "") };
      }

      // Append a message to a panel's transcript (kept above the live line).
      function show(id, mine, main, note) {
        const el = $(id);
        if (el.dataset.fresh !== "0") ((el.textContent = ""), (el.dataset.fresh = "0"));
        const msg = document.createElement("div");
        msg.className = "msg";
        for (const [cls, t] of [
          ["mine", mine],
          ["", main],
          ["note", note],
        ]) {
          if (!t) continue;
          const span = document.createElement("span");
          if (cls) span.className = cls;
          else span.style.display = "block";
          span.textContent = t; // textContent: model output is never parsed as HTML
          msg.append(span);
        }
        el.insertBefore(msg, el.querySelector(".live"));
        el.scrollTop = el.scrollHeight;
      }

      // Interim (not yet final) speech of the current speaker, replaced on every update.
      function showLive(lang, text) {
        const el = $(`out-${lang}`);
        if (el.dataset.fresh !== "0") ((el.textContent = ""), (el.dataset.fresh = "0"));
        let live = el.querySelector(".live");
        if (!live)
          ((live = document.createElement("span")), (live.className = "live"), el.append(live));
        live.textContent = text;
        el.scrollTop = el.scrollHeight;
      }

      function speak(text, lang) {
        if (store.get("tr.voice", "1") !== "1" || !window.speechSynthesis || !text) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = LANG[lang].speech;
        speechSynthesis.speak(u); // queued, so phrases are read in order
      }

      // Each phrase is translated as soon as it is recognized; requests run in parallel,
      // but results are shown and spoken strictly in the order phrases were said.
      let order = Promise.resolve();
      function handle(from, text) {
        text = text.trim();
        if (!text) return;
        show(`out-${from}`, "", text, "");
        $("status").textContent = "Перевожу… / 翻译中…";
        const pending = translate(from, text);
        order = order.then(async () => {
          try {
            const r = await pending;
            show(`out-${r.to}`, text, r.translation, r.note);
            speak(r.translation, r.to);
            $("status").textContent = "Готово / 完成";
          } catch (e) {
            $("status").textContent = e.message;
          }
        });
      }

      // ---- Auto mode: mic always on, no buttons; Whisper detects the language of each phrase ----
      const detectLang = (text) => (/[\u3400-\u9fff]/.test(text) ? "zh" : "ru");
      const STEP_MS = 50;
      const END_SILENCE_MS = 700; // pause that ends a phrase
      const MIN_VOICED_MS = 300; // shorter = cough/click; also stops Whisper hallucinating on noise
      const MAX_PHRASE_MS = 20000;
      let auto = null;
      let sttOrder = Promise.resolve();

      async function transcribe(blob) {
        const key = store.get("tr.key", "");
        const fd = new FormData();
        fd.append("file", blob, blob.type.includes("mp4") ? "speech.mp4" : "speech.webm");
        fd.append("model", store.get("tr.stt", "") || "groq/whisper-large-v3-turbo");
        const pending = fetch("/v1/audio/transcriptions", {
          method: "POST",
          headers: key ? { Authorization: `Bearer ${key}` } : {},
          body: fd,
        }).then(async (res) => {
          if (!res.ok)
            throw new Error(`STT HTTP ${res.status}: ${(await res.text()).slice(0, 200)}`);
          return String((await res.json()).text ?? "").trim();
        });
        // phrases are recognized in parallel but handed to translation in the order spoken
        sttOrder = sttOrder.then(async () => {
          try {
            const text = await pending;
            if (text) handle(detectLang(text), text);
          } catch (e) {
            $("status").textContent = e.message;
          }
        });
      }

      async function startAuto(btn) {
        if (auto) return auto.stop();
        if (active) ((active.keepOn = false), active.stop());
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true },
          });
        } catch (e) {
          $("status").textContent = `Mic: ${e.message}`;
          return;
        }
        const ctx = new AudioContext();
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 1024;
        ctx.createMediaStreamSource(stream).connect(analyser);
        const buf = new Float32Array(analyser.fftSize);
        let rec, voicedMs, silentMs, startedAt;
        let noise = 0.01;
        let tainted = false;

        // Recording runs continuously and is cut at pauses, so the first syllable is never lost.
        const newRec = () => {
          const chunks = [];
          rec = new MediaRecorder(stream);
          rec.ondataavailable = (e) => chunks.push(e.data);
          rec.chunks = chunks;
          rec.start();
          voicedMs = silentMs = 0;
          startedAt = Date.now();
        };
        const cut = (send) => {
          const r = rec;
          const enough = send && voicedMs >= MIN_VOICED_MS;
          r.onstop = () => enough && transcribe(new Blob(r.chunks, { type: r.mimeType }));
          r.stop();
          newRec();
        };
        newRec();

        const timer = setInterval(() => {
          // While a translation is read aloud the mic hears it; drop that audio so the app
          // does not translate its own voice. shortcut: speech said over the voice is lost too.
          if (window.speechSynthesis?.speaking) return void (tainted = true);
          if (tainted) return ((tainted = false), cut(false));
          analyser.getFloatTimeDomainData(buf);
          let sum = 0;
          for (const x of buf) sum += x * x;
          const rms = Math.sqrt(sum / buf.length);
          const loud = rms > Math.max(0.015, noise * 3); // adapts to room noise
          if (loud) ((voicedMs += STEP_MS), (silentMs = 0));
          else ((silentMs += STEP_MS), (noise = noise * 0.95 + rms * 0.05));
          const age = Date.now() - startedAt;
          if (voicedMs && (silentMs >= END_SILENCE_MS || age >= MAX_PHRASE_MS)) cut(true);
          else if (!voicedMs && age >= 5000) cut(false); // only silence so far: discard, start fresh
        }, STEP_MS);

        auto = {
          stop() {
            clearInterval(timer);
            rec.onstop = null;
            rec.stop();
            stream.getTracks().forEach((t) => t.stop());
            ctx.close();
            auto = null;
            btn.setAttribute("aria-pressed", "false");
            btn.textContent = "🎧 Авто: говорят оба";
            $("status").textContent = "Готово / 完成";
          },
        };
        btn.setAttribute("aria-pressed", "true");
        btn.textContent = "⏹ Стоп / 停止";
        $("status").textContent = "Слушаю всех… / 都在听…";
      }
      $("auto").onclick = (e) => startAuto(e.currentTarget);

      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      let active = null;
      function listen(lang, btn) {
        if (!SR) {
          $("status").textContent =
            "Браузер не поддерживает распознавание речи — используйте Chrome/Safari";
          return;
        }
        if (auto) auto.stop();
        if (active) {
          const wasSame = active.lang === LANG[lang].speech;
          active.keepOn = false;
          active.stop();
          if (wasSame) return; // same button again = stop; other side's button = switch speaker
        }
        const rec = new SR();
        rec.lang = LANG[lang].speech;
        rec.continuous = true; // keep listening: translate phrase by phrase while the person talks
        rec.interimResults = true;
        rec.keepOn = true;
        rec.onresult = (e) => {
          let interim = "";
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const t = e.results[i][0].transcript;
            // While the translation is read aloud the mic hears it too; dropping it avoids a
            // translate-the-translation loop. shortcut: also drops real speech said over the
            // voice; with headphones, turn this guard off.
            if (e.results[i].isFinal && !speechSynthesis?.speaking) handle(lang, t);
            else interim += t;
          }
          showLive(lang, interim);
        };
        rec.onerror = (e) => {
          if (e.error !== "no-speech") $("status").textContent = `Mic: ${e.error}`;
          if (e.error === "not-allowed") rec.keepOn = false;
        };
        rec.onend = () => {
          showLive(lang, "");
          if (rec.keepOn) return rec.start(); // browsers end the session after a pause; resume
          if (active === rec) active = null;
          btn.classList.remove("on");
        };
        rec.start();
        active = rec;
        btn.classList.add("on");
        $("status").textContent = LANG[lang].listening;
      }

      document
        .querySelectorAll("[data-mic]")
        .forEach((b) => b.addEventListener("click", () => listen(b.dataset.mic, b)));
      document.querySelectorAll("[data-send]").forEach((b) =>
        b.addEventListener("click", () => {
          const input = $(`txt-${b.dataset.send}`);
          handle(b.dataset.send, input.value);
          input.value = "";
        })
      );
      ["ru", "zh"].forEach((l) =>
        $(`txt-${l}`).addEventListener(
          "keydown",
          (e) => e.key === "Enter" && document.querySelector(`[data-send=${l}]`).click()
        )
      );

      $("open-settings").onclick = () => {
        $("s-key").value = store.get("tr.key", "");
        $("s-model").value = store.get("tr.model", "");
        $("s-voice").checked = store.get("tr.voice", "1") === "1";
        $("s-stt").value = store.get("tr.stt", "");
        $("settings").showModal();
      };
      $("settings").addEventListener("close", () => {
        store.set("tr.key", $("s-key").value.trim());
        store.set("tr.model", $("s-model").value.trim());
        store.set("tr.voice", $("s-voice").checked ? "1" : "0");
        store.set("tr.stt", $("s-stt").value.trim());
      });

      // self-check of the reply parser
      console.assert(
        parseReply('```json\n{"translation":"你好","note":""}\n```').translation === "你好"
      );
      console.assert(parseReply("просто текст").translation === "просто текст");
    </script>
  </body>
</html>
