  <text x="1240" y="62" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="900" fill="#f4f4f4" letter-spacing="3">УДАР <tspan fill="#e3262f">В МОЗГ</tspan></text>
