  <text x="606" y="330" font-family="DejaVu Sans, Arial, sans-serif" font-size="70" font-weight="900" fill="#e3262f">втрое дороже</text>
  <text x="606" y="424" font-family="DejaVu Sans, Arial, sans-serif" font-size="70" font-weight="900" fill="#f4f4f4">кто нажился?</text>
