<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- generated from tiktok-avatar.svg: same host, 16:9 preview for the Telegram post -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#26396a" />
      <stop offset="0.55" stop-color="#121a33" />
      <stop offset="1" stop-color="#090c16" />
    </radialGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0" stop-color="#f8d9c0" />
      <stop offset="0.7" stop-color="#eec5a6" />
      <stop offset="1" stop-color="#d9a98a" />
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0cf8c" />
      <stop offset="0.6" stop-color="#d8ae68" />
      <stop offset="1" stop-color="#b98d4c" />
    </linearGradient>
    <linearGradient id="blazer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2c34" />
      <stop offset="1" stop-color="#0d0e12" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#dfe3ea" />
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="0.5" stop-color="#bcd4ff" stop-opacity="0.06" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12" />
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
    <clipPath id="round"><circle cx="540" cy="540" r="540" /></clipPath>
  </defs>
